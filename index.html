        let currentTargetLang = 'ko'; 
        let newsCache = {};

        document.addEventListener('DOMContentLoaded', () => {
            const userLang = navigator.language || navigator.userLanguage; 
            const shortLang = userLang.split('-')[0]; 
            const supportedLangs = ['ko', 'en', 'ja', 'zh', 'es'];

            if (shortLang === 'zh') {
                currentTargetLang = 'zh-CN';
            } else if (supportedLangs.includes(shortLang)) {
                currentTargetLang = shortLang;
            } else {
                currentTargetLang = 'en';
            }
            
            document.getElementById('lang-selector').value = currentTargetLang;
            document.getElementById('ui-lang-label').innerText = UI_DICT[currentTargetLang].langLabel;
        });

        document.getElementById('lang-selector').addEventListener('change', (e) => {
            currentTargetLang = e.target.value;
            document.getElementById('ui-lang-label').innerText = UI_DICT[currentTargetLang].langLabel;
            newsCache = {}; 
        });

            container: 'map', style: 'mapbox://styles/mapbox/satellite-streets-v12', 
            center: [126.9780, 37.5665], zoom: 1.5, projection: 'globe' 
        });

        // 💡 국가 및 도시 검색 플러그인 추가 (Geocoding)
        const geocoder = new MapboxGeocoder({
            accessToken: mapboxgl.accessToken,
            mapboxgl: mapboxgl,
            placeholder: '국가, 도시 검색...'
        });
        map.addControl(geocoder, 'top-left');

        geocoder.on('result', function(e) {
            const lng = e.result.center[0];
            const lat = e.result.center[1];
            
            // 데스크탑/모바일 상관없이 검색 결과 선택 시 바로 뉴스 표시
            fetchAndShowNews(lat, lng);
        });

        map.on('style.load', () => { map.setFog({ 'color': 'rgb(186, 210, 235)', 'high-color': 'rgb(36, 92, 223)' }); });
        map.on('load', () => {
            map.addSource('countries-source', { 'type': 'geojson', 'data': 'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json' });
            map.addLayer({ 'id': 'country-fills', 'type': 'fill', 'source': 'countries-source', 'paint': { 'fill-color': 'transparent' } });
            map.addLayer({ 'id': 'country-fills-hover', 'type': 'fill', 'source': 'countries-source', 'paint': { 'fill-color': 'rgba(255, 255, 255, 0.2)' }, 'filter': ['==', 'name', ''] });
        });

        const tooltip = document.getElementById('hover-tooltip');
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        map.on('mousemove', 'country-fills', (e) => {
            if (isTouchDevice) return; 
            if (e.features.length > 0) {
                map.getCanvas().style.cursor = 'pointer';
                const countryName = e.features[0].properties.name;
                map.setFilter('country-fills-hover', ['==', 'name', countryName]);
                if (countryName) {
                    tooltip.innerText = countryName; tooltip.style.display = 'block';
                    tooltip.style.left = (e.originalEvent.pageX + 15) + 'px'; tooltip.style.top = (e.originalEvent.pageY + 15) + 'px';
                }
            }
        });

        map.on('mouseleave', 'country-fills', () => {
            if (isTouchDevice) return;
            map.getCanvas().style.cursor = ''; map.setFilter('country-fills-hover', ['==', 'name', '']); tooltip.style.display = 'none';

        const DEFAULT_RESOURCES = {
            video: [ {name: 'Reuters', url: 'https://www.youtube.com/@Reuters'}, {name: 'AP', url: 'https://www.youtube.com/@AP'} ],
            text: [ {name: 'Reuters', url: 'https://www.reuters.com/'}, {name: 'AP News', url: 'https://apnews.com/'} ]
        };

        const PUBLIC_BROADCASTERS = { 'KR': 'KBS', 'JP': 'NHK', 'CN': 'CCTV', 'TW': 'PTS', 'IN': 'DD News', 'US': 'PBS', 'GB': 'BBC', 'VN': 'VTV', 'FR': 'France 24', 'DE': 'DW', 'AU': 'ABC News', 'CA': 'CBC News' };
        
        // 특정 공식 채널 고정 (블락 체크용)
        const OFFICIAL_CHANNELS = { 'GB': 'UC16niRr50-MSBwiO3YDb3RA', 'US': 'UC6ZFN9Tx6xh-skXCuRHCDpQ', 'JP': 'UCGCZAYq5OEM337424tU1rZA', 'VN': 'UCjHMMtZExQoQhXN2E6613hQ', 'FR': 'UCCQw_O-6gE72ZqD4Rj07pDA', 'DE': 'UCknLrEdhRCp1aegoMqRaCZg' };

        // 💡 scripts.js의 localNewsData를 동적으로 병합하여 60+ 국가 데이터 연동
        if (typeof localNewsData !== 'undefined') {
            for (const [code, data] of Object.entries(localNewsData)) {
                if (code !== 'DEFAULT') {
                    if (!COUNTRY_RESOURCES[code]) {
                        COUNTRY_RESOURCES[code] = {
                            video: data.youtubeLinks.map(l => ({name: l.name, url: l.url})),
                            text: data.textLinks.map(l => ({name: l.name, url: l.url}))
                        };
                    }
                    if (!PUBLIC_BROADCASTERS[code] && data.youtubeLinks && data.youtubeLinks.length > 0) {
                        PUBLIC_BROADCASTERS[code] = data.youtubeLinks[0].name;
                    }
                }
            }
        }

        // 💡 3. 기능 개선: 뉴스 검색 쿼리(CUSTOM_QUERIES) 최적화
        const CUSTOM_QUERIES = { 
            'KR': '대한민국 최신 뉴스 (KBS OR YTN OR MBC OR SBS) -vlog -music', 
            'VN': 'Tin tức Việt Nam mới nhất -VTV -VTV24',
            'JP': '日本 最新 ニュース (NHK OR ANN OR TBS) -vlog -music',
            'US': 'US breaking news (PBS OR AP) -vlog',
            'FR': 'France actualités (France 24 OR TF1) -vlog',
            'DE': 'Deutschland aktuelle Nachrichten (DW OR Tagesschau) -vlog'
        };

        function getCountryLangCode(countryCode) {
            const langMap = { 'KR': 'ko', 'JP': 'ja', 'CN': 'zh-CN', 'TW': 'zh-TW', 'IN': 'hi', 'VN': 'vi', 'US': 'en', 'GB': 'en', 'FR': 'fr', 'DE': 'de', 'AU': 'en', 'CA': 'en', 'ES': 'es' };
            return langMap[countryCode] || 'en'; 
        }

        let pendingNewsRequest = null;

        map.on('click', async function(e) {
            let lat = e.lngLat.lat; let lng = e.lngLat.lng;
            
            // 모바일/터치 기기 감지 (폴더폰, 태블릿 등 터치 지원 화면 전체)
            const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
            
            if (isTouchDevice) {
                try {
                    const locationInfo = await getLocationInfo(lat, lng);
                    if (!locationInfo || !locationInfo.name) return;
                    
                    document.getElementById('touch-confirm-msg').innerText = `${locationInfo.name} 지역이 맞나요?`;
                    document.getElementById('touch-confirm-toast').classList.add('show');
                    
                    pendingNewsRequest = { lat: lat, lng: lng, locationInfo: locationInfo };
                } catch(err) { console.error(err); }
            } else {
                // 💡 데스크탑: 줌 애니메이션 효과 추가 후 바로 실행
                map.flyTo({ center: [lng, lat], zoom: 4, speed: 1.2, curve: 1.4, essential: true });
                fetchAndShowNews(lat, lng);
            }
        });

        function confirmCountry() {
            document.getElementById('touch-confirm-toast').classList.remove('show');
            if (pendingNewsRequest) {
                map.flyTo({ center: [pendingNewsRequest.lng, pendingNewsRequest.lat], zoom: 4, speed: 1.2, curve: 1.4, essential: true });
                fetchAndShowNews(pendingNewsRequest.lat, pendingNewsRequest.lng, pendingNewsRequest.locationInfo);
                pendingNewsRequest = null;
            }
        }

        function cancelCountry() {
            document.getElementById('touch-confirm-toast').classList.remove('show');
            pendingNewsRequest = null;
        }

        async function fetchAndShowNews(lat, lng, preFetchedLocation = null) {
            showLoadingModal();
            try {
                const locationInfo = preFetchedLocation || await getLocationInfo(lat, lng);
                const localLangCode = getCountryLangCode(locationInfo.code);
                
                const cacheKey = `${locationInfo.code}_${currentTargetLang}`;
                if (newsCache[cacheKey]) {
                    updateModal(locationInfo, newsCache[cacheKey].videoData, newsCache[cacheKey].textNews);
                    return;
                }

                let searchKeyword = PUBLIC_BROADCASTERS[locationInfo.code] || "Official News";
                const translatedCountry = await translateText(locationInfo.name, localLangCode);
                
                let [videoData, textNews] = await Promise.all([
                    getNewsVideoData(locationInfo.code, searchKeyword, translatedCountry),
                    getTextNews(locationInfo.code, translatedCountry)
                ]);
                
                if (textNews) {
                    const translationPromises = [translateText(textNews.title, currentTargetLang)];
                    if (textNews.description) translationPromises.push(translateText(textNews.description, currentTargetLang));
                    const translatedResults = await Promise.all(translationPromises);
                    textNews.title = translatedResults[0]; 
                    if (textNews.description) textNews.description = translatedResults[1]; 
                }
                
                newsCache[cacheKey] = { videoData: videoData, textNews: textNews };
                updateModal(locationInfo, videoData, textNews);
            } catch (error) {
                const ui = UI_DICT[currentTargetLang];
                showErrorBox(ui.error);
            }
        }

        async function translateText(text, targetLang) {
            if (!text) return "";
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url); const data = await response.json();
                return data[0].map(item => item[0]).join("");
            } catch (error) { return text; }
        }

        async function getLocationInfo(lat, lng) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=3&accept-language=${currentTargetLang}`;
                const response = await fetch(url); const data = await response.json();
                let name = "Unknown Area"; let code = "";
                if (data.address) { name = data.address.country || data.address.state || "Unknown Area"; code = data.address.country_code ? data.address.country_code.toUpperCase() : ""; }
                return { name: name, code: code };
            } catch (error) { return { name: "Unknown", code: "" }; }
        }

        async function getNewsVideoData(countryCode, searchKeyword, countryName) {
            let result = { type: 'none', videoId: '', officialLinks: [], channelName: PUBLIC_BROADCASTERS[countryCode] || '공식 채널' };
            if (!countryCode) return result;

            try {
                const localLang = getCountryLangCode(countryCode);
                const strictQuery = CUSTOM_QUERIES[countryCode] || `${searchKeyword} ${countryName} official news -vlog -music`;
                const regionParam = `&regionCode=${countryCode}`;
                const langParam = `&relevanceLanguage=${localLang}`;

                if (OFFICIAL_CHANNELS[countryCode]) {
                    const channelId = OFFICIAL_CHANNELS[countryCode];
                    let embedUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&order=date&channelId=${channelId}&maxResults=1&key=${YOUTUBE_API_KEY}`;
                    let embedRes = await fetch(embedUrl); let embedData = await embedRes.json();
                    
                    if (embedData.items && embedData.items.length > 0) {
                        result.type = 'official';
                        result.videoId = embedData.items[0].id.videoId;
                        result.channelName = embedData.items[0].snippet.channelTitle; 
                        return result; 
                    }
                    result.isBlocked = true; 
                    result.blockedChannelName = PUBLIC_BROADCASTERS[countryCode];
                }

                let queryUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(strictQuery)}&type=video&videoEmbeddable=true&videoCategoryId=25${regionParam}${langParam}&order=relevance&maxResults=1&key=${YOUTUBE_API_KEY}`;
                let response = await fetch(queryUrl);
                let data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    result.type = 'fallback';
                    result.videoId = data.items[0].id.videoId;
                    result.channelName = data.items[0].snippet.channelTitle; 
                    return result;
                }
                return result; 
            } catch (error) { return result; }
        }

        async function getTextNews(countryCode, localCountryName) {
            if (!countryCode) return null;
            try {
                let url = `https://newsdata.io/api/1/news?apikey=${NEWS_API_KEY}&country=${countryCode.toLowerCase()}&q=${encodeURIComponent(localCountryName)}`;
                let response = await fetch(url);
                
                if (response.ok) {
                    let data = await response.json();
                    if (data.results && data.results.length > 0) return data.results[0]; 
                }
                
                // 검색어 없이 국가 코드로만 1차 폴백
                url = `https://newsdata.io/api/1/news?apikey=${NEWS_API_KEY}&country=${countryCode.toLowerCase()}`;
                response = await fetch(url); 
                if (response.ok) {
                    let data = await response.json();
                    if (data.results && data.results.length > 0) return data.results[0]; 
                }

                // 💡 3. 기능 개선: NewsData.io 결과가 없을 때 사용할 대체(Fallback) API 로직 추가 (GNews API 활용)
                const GNEWS_API_KEY = '5f2e0e9803bfdbb091fcf3b85bb12b67'; // 무료 GNews API 임시 키
                let gnewsUrl = `https://gnews.io/api/v4/top-headlines?country=${countryCode.toLowerCase()}&apikey=${GNEWS_API_KEY}`;
                response = await fetch(gnewsUrl);
                if (response.ok) {
                    let data = await response.json();
                    if (data.articles && data.articles.length > 0) {
                        const article = data.articles[0];
                        return {
                            title: article.title,
                            description: article.description,
                            link: article.url,
                            source_id: article.source.name
                        };
                    }
                }

                return null;
            } catch (error) { return null; }
        }

        function showLoadingModal() {
            const ui = UI_DICT[currentTargetLang];
            const modal = document.getElementById('news-modal');
            const overlay = document.getElementById('modal-overlay');

            document.getElementById('news-title').innerText = "...";
            document.getElementById('loading-msg').innerText = ui.loading;
            
            document.getElementById('loading-msg').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('modal-content-area').style.display = 'none';
            document.getElementById('news-video').src = "";
            
            // 모달 표시 (애니메이션 클래스 추가)
            modal.style.display = 'block';
            overlay.style.display = 'block';
            // 약간의 딜레이를 주어 브라우저가 display: block을 인식한 후 transition이 동작하게 함
            setTimeout(() => {
                modal.classList.add('show');
                overlay.classList.add('show');
            }, 10);
        }

        function showErrorBox(message) {
            document.getElementById('error-msg').innerText = message; 
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('loading-msg').style.display = 'none';
        }

        function renderResourceButtons(containerId, resourceArray) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            resourceArray.forEach(resource => {
                const btn = document.createElement('a');
                btn.href = resource.url;
                btn.target = '_blank';
                btn.className = 'resource-btn';
                btn.innerText = `🔗 ${resource.name}`;
                container.appendChild(btn);
            });
        }

        function updateModal(locationInfo, videoData, textNews) {
            const ui = UI_DICT[currentTargetLang];
            
            document.getElementById('video-resource-title').innerText = ui.videoTitle;
            document.getElementById('text-resource-title').innerText = ui.textTitle;

            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('modal-content-area').style.display = 'block';
            document.getElementById('news-title').innerHTML = `${locationInfo.name} <span class="translation-badge">${ui.translated}</span>`;
            
            const videoIndicator = document.getElementById('video-source-indicator');
            const videoIframe = document.getElementById('news-video');
            const countryCode = locationInfo.code;
            
            if (videoData.videoId) {
                if (videoData.isBlocked) {
                    videoIndicator.innerHTML = `${ui.blockedVideo} <b>${videoData.channelName}</b>`;
                    videoIndicator.style.background = '#fef7e0'; videoIndicator.style.color = '#b06000';
                } else {
                    videoIndicator.innerHTML = `${ui.currentVideo} <b>${videoData.channelName}</b>`;
                    videoIndicator.style.background = '#e8f0fe'; videoIndicator.style.color = '#1a73e8';
                }
                videoIframe.src = `https://www.youtube.com/embed/${videoData.videoId}?autoplay=1&mute=1&cc_load_policy=1&hl=${currentTargetLang}`;
                document.getElementById('video-wrapper').style.display = 'block';
            } else {
                document.getElementById('video-wrapper').style.display = 'none';
                videoIndicator.innerHTML = ui.noVideo;
            }

            const videoResources = (COUNTRY_RESOURCES[countryCode] && COUNTRY_RESOURCES[countryCode].video) ? COUNTRY_RESOURCES[countryCode].video : DEFAULT_RESOURCES.video;
            renderResourceButtons('video-resource-btns', videoResources);

            const textIndicator = document.getElementById('text-source-indicator');
            const textContainer = document.getElementById('text-news-container');
            
            if (textNews) {
                const sourceName = textNews.source_id ? textNews.source_id.toUpperCase() : 'News Media';
                textIndicator.innerHTML = `${ui.currentText} <b>${sourceName}</b>`;
                textIndicator.style.display = 'inline-block';

                const description = textNews.description ? textNews.description.substring(0, 130) + '...' : ui.defaultDesc;
                textContainer.innerHTML = `<div class="article-box"><div class="article-title">${textNews.title}</div><div class="article-desc">${description}</div><a href="${textNews.link}" target="_blank" class="article-link">${ui.readMore}</a></div>`;
            } else {
                textIndicator.style.display = 'none';
                textContainer.innerHTML = `<div class="article-box"><div class="article-desc">${ui.noText}</div></div>`;
            }

            const textResources = (COUNTRY_RESOURCES[countryCode] && COUNTRY_RESOURCES[countryCode].text) ? COUNTRY_RESOURCES[countryCode].text : DEFAULT_RESOURCES.text;
            renderResourceButtons('text-resource-btns', textResources);
        }

        function closeModal() {
            const modal = document.getElementById('news-modal');
            const overlay = document.getElementById('modal-overlay');
            
            // 애니메이션 클래스 제거
            modal.classList.remove('show');
            overlay.classList.remove('show');
            
            // 애니메이션 완료 후 display: none 처리
            setTimeout(() => {
                modal.style.display = 'none';
                overlay.style.display = 'none';
                document.getElementById('news-video').src = ""; 
            }, 300); // CSS transition 시간(0.3s)과 동일하게 맞춤
        }
    </script>
</body>
</html>
