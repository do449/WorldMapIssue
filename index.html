<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldMapIssue - 글로벌 뉴스</title>
    
    <!-- Mapbox GL JS 라이브러리 불러오기 -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    
    <!-- 디자인 (CSS) 영역 -->
    <style>
        /* 화면 전체 여백 제거 및 스크롤 숨김 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        /* 지도가 화면에 꽉 차도록 설정 */
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* 우측 상단 언어 선택 팝업 디자인 */
        .lang-popup {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 8px 15px;
            border-radius: 20px; /* 둥근 모서리 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); /* 부드러운 그림자 */
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        /* 언어 선택 텍스트 버튼 디자인 */
        #language-select {
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            cursor: pointer;
        }

        /* Mapbox 툴팁 둥근 모서리 및 그림자 디자인 */
        .mapboxgl-popup-content {
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 3D 지도가 그려질 영역 -->
    <div id="map"></div>

    <!-- 우측 상단 언어 선택 팝업 영역 -->
    <div class="lang-popup">
        <!-- 인라인 SVG 지구본 아이콘 -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="globe-icon">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <select id="language-select">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <!-- 기능 (JavaScript) 영역 -->
    <script>
        // 1. Mapbox 토큰 설정 (회원님의 실제 토큰 적용 완료)
        mapboxgl.accessToken = 'pk.eyJ1IjoiZG80NDkiLCJhIjoiY21zY2sycmU0MWszbDJ4b2RiZGU4cjBmciJ9.Er4jq7iEltaGLG8_JmVgIw';

        // 2. 3D 지구본 생성
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-streets-v12', // 위성 지도 스타일
            center: [126.9780, 37.5665], // 초기 중심 좌표 (대한민국 서울)
            zoom: 2,
            projection: 'globe' // 3D 지구본 모드 활성화
        });

        // 3. 우주 배경 및 대기권 효과 추가 (더욱 사실적인 지구본 연출)
        map.on('style.load', () => {
            map.setFog({
                'color': 'rgb(186, 210, 235)',
                'high-color': 'rgb(36, 92, 223)',
                'space-color': 'rgb(11, 11, 25)'
            });
        });

        // 4. 예시 툴팁 마커 추가 (추후 뉴스 API 연동 자리)
        const popup = new mapboxgl.Popup({ offset: 25 })
            .setHTML('<h3>한국 뉴스</h3><p>이곳에 글로벌 뉴스 API 데이터가 들어갈 예정입니다.</p>');

        new mapboxgl.Marker()
            .setLngLat([126.9780, 37.5665])
            .setPopup(popup)
            .addTo(map);

        // 5. 언어 선택 기능 이벤트 (선택 시 터미널에 기록)
        document.getElementById('language-select').addEventListener('change', function(e) {
            console.log("선택된 언어:", e.target.value);
            // 추후 이곳에 언어별 데이터를 다시 불러오는 코드를 작성할 예정입니다.
        });
    </script>
</body>
</html>
